# CI workflow for Stroop VM
#
# Runs build, tests, and benchmarks across multiple platforms:
# - Linux: x86_64 and arm64
# - macOS: x86_64 (Intel) and arm64 (Apple Silicon)
#
# Benchmarks:
# - Linux: Uses CodSpeed for continuous performance tracking
# - macOS: Uses cargo bench (criterion) since CodSpeed doesn't support Darwin
#
# Benchmark groups are suffixed with platform (e.g., vm-linux-x86_64, vm-linux-arm64)
# via BENCH_SUFFIX env var to allow CodSpeed to track each platform separately.
#
# Fork PRs skip CodSpeed upload since they don't have access to secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x86_64
            runner: macos-15-intel
          - os: macos
            arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: cargo test

  bench_linux:
    name: Benchmark (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --locked

      - name: Build benchmarks
        run: cargo codspeed build -p stroop-vm -m walltime
        env:
          BENCH_SUFFIX: linux-${{ matrix.arch }}

      - name: Run benchmarks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          run: cargo codspeed run -p stroop-vm
        env:
          BENCH_SUFFIX: linux-${{ matrix.arch }}

  bench_darwin:
    name: Benchmark (macos-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run benchmarks
        run: cargo bench -p stroop-vm
