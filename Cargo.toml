[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
stroop-assembly = { path = "crates/stroop-assembly" }
stroop-vm-bytecode = { path = "crates/stroop-vm-bytecode" }
stroop-assembly-text = { path = "crates/stroop-assembly-text" }
stroop-vm = { path = "crates/stroop-vm" }
stroop-cli = { path = "crates/stroop-cli" }

[profile.release]
lto = "fat"
